site: demo-shop
entry: https://fixtures.adaparse.local/catalog
target:
  preset: product_list
  fields:
    - name: title
      required: true
    - name: price
      required: true
      normalize: money
    - name: url
      required: true
    - name: image
      required: false
    - name: currency
      required: false
    - name: availability
      required: false
heal:
  enabled: true
  discovery: true
  canary: balanced
budgets:
  max_pages: 10
  max_depth: 2
  concurrency: 2
  request_timeout_ms: 5000
  time_budget_ms: 15000
output:
  format: json
  path: ./out/demo-product-list.json
fixtures:
  https://fixtures.adaparse.local/catalog: fixtures/html/A_old_layout.html
state_dir: .adaparse/demo-shop
